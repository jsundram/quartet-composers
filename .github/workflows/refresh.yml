# Monthly readership top-up and list re-read. Runs scripts/refresh.py and opens a PR when it changes
# something; a composer new on the list comes with a dossier and a box (.github/workflows/roster.yml).
#
# WHY A SCHEDULE AT ALL. The page-view numbers go stale silently: nothing looks wrong when the
# medians are eight months old, the chart just quietly stops being about now. The list and
# Wikidata ride along so an edit there reaches the chart the month it happens, and the editorial
# part — who is on the list at all — waits for a human to tick a box.
#
# WHY THE 3rd. The pageviews API needs a day or two to settle the month that just ended, and
# refresh.py's whole job is the month that just ended. On the 1st it would find nothing new and
# no-op, which is harmless but pointless.
#
# WHY A PR AND NOT A PUSH. scripts/validate.py has caught four dataset bugs that looked entirely
# plausible in the file, and every one of them needed a human to read a two-line diff. A robot
# pushing straight to main is how the fifth one ships. The PR is also where the "did anything
# move?" question gets answered — 884 changed numbers with one composer up 30x is the shape of a
# wrong-article join, and it is legible in a diff and invisible in a chart.
#
# NB a PR opened with the built-in GITHUB_TOKEN does NOT trigger other workflows, so checks.yml
# will not run on it. That is why refresh.py runs validate.py itself and this job fails if the
# gate does — the gate must not be skippable just because the robot opened the PR.
name: refresh data

on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch: {}       # "run it now" — the same job, on demand

permissions:
  contents: write
  pull-requests: write

# One at a time. Two overlapping runs would race on the same branch and the loser would force-push
# the winner's data away.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 2 so validate.py can diff composers.json against the previous commit — the
      # drift checks are the only thing that can see a wrong-article join.
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      # Every run, not only when a month has completed: the list page is re-read too, and
      # refresh.py writes nothing when neither has moved. It fails the job if the data gate fails,
      # and leaves the version alone in that case.
      - name: re-read the list, top up, rebuild, validate, bump V
        run: python3 scripts/refresh.py

      - name: open or update the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "refresh.py changed nothing — no PR"
            exit 0
          fi
          MONTH=$(python3 -c "import json;print(json.load(open('composers.json'))['meta']['views_months'][-1])")
          BRANCH="data/refresh-$MONTH"
          # Before the commit, so HEAD is still main and the dossier covers everyone new since it.
          python3 scripts/roster.py --brief --base HEAD > "$RUNNER_TEMP/brief.md"
          NEW=$(grep -c '<!-- roster:' "$RUNNER_TEMP/brief.md" || true)
          TITLE="Refresh data through $MONTH"
          if [ "$NEW" -gt 0 ]; then TITLE="$TITLE, $NEW new on the list"; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A deterministic branch name so a re-run UPDATES the open PR instead of opening a
          # second one for the same month. A re-run also resets the boxes, with the data.
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "$TITLE" \
            -m "scripts/refresh.py: the list and Wikidata re-read, readership topped up, rebuilt and validated, then a V bump because the shipped files are precached. Opened by .github/workflows/refresh.yml."
          git push -f origin "$BRANCH"
          {
            echo "Monthly run of \`scripts/refresh.py\`. The statistic window ends $MONTH, and \`sw.js\`'s"
            echo "\`V\` is bumped because the shipped files are precached."
            echo
            echo "\`validate.py\` passed in the job that produced this, drift checks against the previous"
            echo "commit included. Worth reading the diff anyway: a composer whose readership moved by a"
            echo "factor is either news or a bad title resolution, and the diff is where you can tell which."
            echo
            cat "$RUNNER_TEMP/brief.md"
          } > "$RUNNER_TEMP/pr-body.md"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
