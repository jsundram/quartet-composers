# pwa-starter: checks.yml @ d2fad01  (+ the og-lint step, the gates job, the ui job)
name: checks

# The repo's checks, in four jobs: `sw` (the service worker, the link preview and the prose gate),
# `gates` (the two branch gates, pull requests only), `ui` (the browser suite) and `data` (the data
# gate and the pipeline's offline tests). Everything below runs with a real exit code on every push
# and PR unless its own entry says otherwise. This was guards for sw.js alone when it was vendored
# from pwa-starter, and the sentence saying so outlived three jobs growing underneath it:
#   - node scripts/sw.test.mjs : behavioral tests of the fetch handler (cache-first, lie-fi
#     bounds, offline fallbacks) against a mocked SW environment.
#   - scripts/sw-lint.py       : the precache-contract checks (the pre-commit hook runs these
#     warn-only; here they fail the build). NB its headline check — a staged SHELL file touched
#     without a V bump — reads `git diff --cached`, which is empty in a CI checkout, so THAT check
#     only bites locally in the hook; CI enforces the other four (missing/renamed entries,
#     cross-origin entries, V's numeric tail, VER_PREFIX agreement).
#   - scripts/sw-lint.py --base : the enhancement the line above used to say was still owed, and
#     the reason CI is where it belongs — it needs BOTH sides of the merge, which the hook never
#     has. Two branches off one base can each bump v32 -> v33 byte-identically; a three-way merge
#     resolves that without a conflict and the second one lands its shell changes with a net V
#     delta of zero, which is invariant 1 failing through a merge instead of through a forgotten
#     bump (#32). It reads the branch's own changes from the merge base and the V it has to clear
#     from the base BRANCH — see the header in sw-lint.py for why those are two different refs.
#     Pull requests only: a push to main has no base to compare against.
#   - scripts/fix-lint.py --base and scripts/ablate.py --base : the two branch gates. Like
#     sw-lint's --base check they need BOTH sides of the merge, so pull requests only, and CI is
#     the only place that has them. fix-lint notices that a branch changed source and no test;
#     ablate proves the tests it DID change actually catch what the source changed, by reverting
#     the source to base and requiring a named check to go red. That second one is the gate PR #23
#     needed and did not have: four of its six rounds fixed a defect in the previous round's fix,
#     each shipped on a green suite. Both are skipped by a `No-test:` trailer.
#   - scripts/ui-test.sh : the browser suite, in a job of its own — see the note above it for why
#     it is not steps in `sw`. It was kept out of CI for a long time on a premise that was simply
#     false (that a runner has no browser); what was actually missing was a POINTER, and #50 fixed
#     that by giving Chrome an X server rather than arguing with the page about one.
#   - scripts/og-lint.py : it used to be hook-only, because its card-size check reads
#     `git diff --cached` and a CI checkout stages nothing. Its meta-length and stated-count
#     checks read the working tree instead, so THOSE run here with a real exit code — which is
#     the point of having them: a link preview that is too long is a thing you otherwise discover
#     by pasting the deployed URL into a validator, i.e. after shipping it. The size check still
#     only bites in the hook.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sw:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so `git merge-base` has history to walk: the --base check below is the whole
      # reason this job needs more than the tip. The repo packs to ~2.5 MB, so it costs nothing.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: syntax-check sw.js
        run: node --check sw.js
      - name: behavioral tests (scripts/sw.test.mjs)
        run: node scripts/sw.test.mjs
      - name: precache lint (scripts/sw-lint.py)
        run: python3 scripts/sw-lint.py
      # Via env rather than interpolated into the shell line: a `${{ }}` inside `run:` is textual
      # substitution, and keeping workflow values out of the command string is the habit that
      # makes that never matter.
      - name: V against the base branch (scripts/sw-lint.py --base)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/sw-lint.py --base "$BASE_SHA"
      # Offline, ~1s: it builds throwaway repos with real branches, because the failure --base
      # exists to catch is one that looks correct from either side alone and cannot be staged from
      # a single commit.
      - name: the --base check's own tests (scripts/sw-lint.test.py)
        run: python3 scripts/sw-lint.test.py
      - name: share-card + link-preview lint (scripts/og-lint.py)
        run: python3 scripts/og-lint.py

  # The branch gates. A separate job so its failure reads as "this branch is unproven" rather than
  # as a broken service worker, and because both steps want the full history the sw job also asks
  # for. Pull requests only: a push to main has no base to compare against.
  gates:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # 22 rather than the 20 the sw job pins, because --with-ui below reaches ui.test.mjs, whose
      # entire CDP client is the global WebSocket that node 20 does not have. The sw job keeps 20
      # on purpose — sw.js is the one file here that has to run in whatever the browser gives it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Offline, ~3s, and it runs FIRST: it builds throwaway repos with real branches, so a gate
      # that has itself regressed says so before it judges this branch.
      - name: the gates' own tests (scripts/fix-lint.test.py)
        run: python3 scripts/fix-lint.test.py
      - name: source without a test (scripts/fix-lint.py --base)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/fix-lint.py --base "$BASE_SHA"
      # Only the suites that cover what this branch touched — and --with-ui adds the browser one,
      # which is the whole prize of putting a browser on the runner. Without it this step printed
      # "no CI-runnable suite covers this branch's source" for every branch whose source is
      # chart.js, table.js or styles.css — i.e. exactly the branches that change what the page
      # LOOKS like, where an ablation has the most to prove. #55's was owed locally and run by
      # hand; it went red in the right two places and nothing here could have known that.
      #
      # It costs nothing on a branch that touched no UI file: COVERS decides what runs, and
      # --with-ui only moves the browser suite from "owed locally" into the runnable list.
      # REQUIRE_BROWSER for the reason the ui job sets it, one step further removed — ablate.py
      # reads a skipped suite as "not runnable here, so it can prove nothing" and then exits 0,
      # so a lost browser would take the gate green rather than red.
      - name: the tests must catch the change (scripts/ablate.py --base --with-ui)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUIRE_BROWSER: "1"
        run: python3 scripts/ablate.py --base "$BASE_SHA" --with-ui

  # The browser suite, against a real Chrome over CDP. It used to say how many checks, and that
  # was stale inside the PR that wrote it — nothing reads THIS file for the number (ui.test.mjs
  # scans README and CLAUDE.md for it), so it could only ever drift.
  # A count that no check can redden is written loosely or not at all; here, not at all. A separate job
  # rather than steps in `sw`, because its failure means "the app regressed" and not "the service
  # worker is broken" — and because it wants a different node (see below). No --base, unlike the
  # gates, so it judges the tree in front of it and runs on pushes as well as pull requests.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # THE PIN THAT BITES. ui.test.mjs has no dependencies because its whole ~25-line CDP client
      # is the global WebSocket, which node 20 does not have — so copying the version from `sw`
      # gets an immediate failure that reads like a browser problem and is not.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # ONE literal for the screenshots' path. It was typed twice — once as the suite's OUT and
      # once as the artifact's path — with nothing able to enforce the agreement, and the drift
      # would have been silent in the worst place: rename it there, and the next FAILING run writes
      # its evidence somewhere the upload does not look, on a job whose only red mark is the
      # failure that evidence was meant to explain.
      #
      # In a STEP because `runner.temp` is not reachable from a job-level `env:` — the runner
      # context exists only inside steps, and a workflow that asks for it there does not fail the
      # job, it fails to PARSE, which is a red X with no log to read. $GITHUB_ENV puts it where
      # both steps below can read it, which is the same one place.
      - name: where the screenshots go if this fails
        run: echo "UI_OUT=$RUNNER_TEMP/ui-test" >> "$GITHUB_ENV"
      # ubuntu-latest ships /usr/bin/google-chrome AND xvfb, and find_chrome takes the first
      # without help — the premise that CI has no browser was false all along (#43). Both are
      # asserted rather than assumed, because the runner image is not this repo's to promise:
      # REQUIRE_BROWSER turns ui-test.sh's exit-0 skip into a failure, so a job that quietly loses
      # its Chrome goes RED having tested nothing instead of green. It covers the X server too —
      # without one this Chrome reports no pointing device at all and nine checks fail at a layout
      # the app is right to be drawing, which is a platform report dressed as nine bug reports.
      #
      # OUT is named rather than mktemp'd because the upload below needs the path BEFORE the run.
      # ui-test.sh will not delete a directory it did not create, so this one survives a PASSING
      # run too — which costs nothing here and is what keeps the same variable from being a way to
      # delete a directory somebody cared about on a laptop. It clears Chrome's profile inside it
      # on every run regardless, or an inherited OUT would reintroduce the stale-shell trap.
      - name: browser suite (scripts/ui-test.sh)
        env:
          REQUIRE_BROWSER: "1"
          OUT: ${{ env.UI_OUT }}
        run: scripts/ui-test.sh
      # No check here reads a pixel — the DOM is the better oracle and a baseline would go red for
      # two reasons that are not bugs. The screenshots are the one look a FAILURE gets, which is
      # why they are sized to survive the resize a reader's viewer applies (#50). ui-test.sh keeps
      # them on disk whenever the suite fails and prints the path; this is that path, on a machine
      # you cannot walk over to. chrome.log is in there too, for the run where Chrome never opened.
      - name: keep the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          # The PNGs and the log, NOT the whole directory: $OUT is also Chrome's user-data-dir,
          # and uploading a browser profile is hundreds of megabytes of nothing anybody will read.
          path: |
            ${{ env.UI_OUT }}/*.png
            ${{ env.UI_OUT }}/chrome.log
          # error, not warn: this step only runs on a failure, and a failure that got as far as
          # opening a browser always leaves a chrome.log. Nothing to upload therefore means the
          # path is wrong, which is the thing you want to be TOLD rather than left to notice when
          # you go looking for the screenshots and there are none.
          if-no-files-found: error

  data:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 2 so validate.py can diff composers.json against the previous commit; the
      # drift checks are the only thing that can see a wrong-article join, which looks entirely
      # plausible in isolation.
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: data gate (scripts/validate.py)
        run: python3 scripts/validate.py
      - name: the gate's own tests (scripts/validate.test.py)
        run: python3 scripts/validate.test.py
      # No network: fetch() is stubbed and the cache is a temp file. It guards the one thing about
      # data/pageviews.json that cannot be seen after the fact — a null that no request justified.
      - name: page-view cache invariants (scripts/fetch_views.test.py)
        run: python3 scripts/fetch_views.test.py
      # Also offline: the page-move rule is pure apart from two requests, and every defect it has
      # had is one the pipeline cannot show you — a double-counted month, a complete chain thrown
      # away, a reverted move read as a permanent one. None of them crashes.
      - name: page-move rule (scripts/pagemoves.test.py)
        run: python3 scripts/pagemoves.test.py
